name: CI — Seoul Compass AI

on:
  push:
    branches: [main, work/gyuhyeon]
  pull_request:
    branches: [main, work/gyuhyeon]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python tests
        run: python -m unittest discover -s tests -v

      - name: Data pipeline validation
        run: python scripts/build_places.py data/sample_places.json /tmp/places.normalized.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JavaScript syntax check
        run: |
          for f in frontend/js/*.js; do node --check "$f"; done

      - name: Ensure secrets are not committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env 파일이 커밋되었습니다. 제거하세요."
            exit 1
          fi
          echo ".env not tracked — OK"

      - name: Build release artifact
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/seoul-compass.zip HEAD
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: seoul-compass-source
          path: dist/seoul-compass.zip
          retention-days: 7
