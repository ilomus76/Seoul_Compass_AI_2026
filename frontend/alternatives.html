<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>다른 코스와 장소 · Seoul Compass AI</title>
  <link rel="stylesheet" href="/css/style.css?v=52">
</head>
<body data-theme="light" class="alternative-page">
  <main class="alternative-content">
    <a id="backToPlan" href="/">← 추천 화면</a>
    <h1>다른 코스와 장소</h1>
    <p id="emptyState" hidden>표시할 방향별 비교나 추가 코스가 없습니다. 추천 화면에서 일정을 분석하면 확인된 결과를 여기에 표시합니다.</p>
    <section id="directionReview" hidden>
      <h2>다른 방향이 선정되지 않은 이유</h2>
      <p class="hint">방향마다 검색 결과와 일정 검증, 순위를 비교했습니다. 토지 이용 표본이 있는 방향에는 지역 특성을 함께 표시합니다.</p>
      <div id="directionReports"></div>
    </section>
    <section id="otherRoutes" hidden>
      <h2>추가 코스</h2>
      <p class="hint">시간과 이동 거리는 추정값입니다.</p>
      <div id="additionalRoutes" class="alternative-list"></div>
    </section>
    <section id="otherPlaces" hidden>
      <h2>추천에 포함되지 않은 장소</h2>
      <div id="additionalPlaces" class="alternative-list"></div>
    </section>
  </main>
  <script src="/js/route.js?v=51"></script>
  <script src="/js/alternatives.js?v=52"></script>
</body>
</html>
