<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2eb">
  <title>연결 확인 · 서울 컴패스 AI</title>
  <style>
    * {box-sizing:border-box}
    body {margin:0; min-height:100svh; display:grid; place-items:center; padding:24px;
      background:#f5f2eb; color:#16233c; font:16px/1.6 system-ui,sans-serif}
    main {width:min(100%,420px); padding:clamp(20px,6vw,36px); border:1px solid #ddd6ca;
      border-radius:16px; background:#fffdf9}
    h1 {margin:0 0 8px; font-size:clamp(22px,6vw,28px); line-height:1.3}
    p {margin:0 0 18px; color:#526074}
    button {min-height:44px; padding:7px 16px; border:0; border-radius:8px; background:#16233c;
      color:white; font:inherit; cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1>서울 컴패스 AI에 연결할 수 없습니다</h1>
    <p>지도와 장소 검색, 일정 계산을 이용하려면 인터넷이나 로컬 서버 연결이 필요합니다.</p>
    <form method="get"><button type="submit">다시 연결</button></form>
  </main>
</body>
</html>
